name: Build and attach release binaries

# Two ways to run:
#   1. Push a tag like v6.1.1  -> builds and attaches automatically
#   2. Actions tab -> Run workflow -> type a tag  -> backfills that release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build. The leading v is optional - 6.1.0 and v6.1.0 both work.'
        required: true

permissions:
  contents: write   # required to upload assets to the release
  id-token: write   # required for the OIDC login to Azure (code signing) — no stored secret

jobs:
  build-windows:
    runs-on: windows-latest
    # The OIDC token's subject is "repo:mehanem-web/net-ether:environment:release",
    # which is what the Azure federated credential matches — any tag, one credential.
    environment: release

    steps:
      # Normalizes "6.1.0" -> "v6.1.0", strips stray whitespace, and confirms
      # the tag actually exists before spending 10 minutes building.
      # Fails in ~2 seconds with a list of real tags if you fat-finger it.
      - name: Resolve and verify tag
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RAW_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            CLEAN="$(printf '%s' "$RAW_TAG" | tr -d '[:space:]')"
            if [ -z "$CLEAN" ]; then
              echo "::error::No tag was given."
              exit 1
            fi
            case "$CLEAN" in
              v*) TAG="$CLEAN" ;;
              *)  TAG="v$CLEAN" ;;
            esac
          else
            # Tag push: github.ref_name is already the bare tag, e.g. v6.1.1
            TAG="$REF_NAME"
          fi

          if ! git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in this repository."
            echo "Tags that do exist:"
            git ls-remote --tags "$REPO_URL" \
              | sed 's|.*refs/tags/||' \
              | grep -v '\^{}' \
              | sort
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Code signing (Azure Artifact Signing, formerly Trusted Signing) ──
      # The workflow authenticates to Azure as this repo via OIDC (federated
      # credential on the net-suite-ci app registration, entity type Environment
      # named "release"), so
      # there is no client secret anywhere. The three IDs below are not secrets
      # — they're names — but live in repo secrets so they aren't in the tree.
      # Signing happens only here; build.bat at home stays unsigned.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Trusted Signing PowerShell module
        shell: pwsh
        run: |
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable TrustedSigning | Select-Object Name, Version

      # Mirrors build.bat exactly: nsis + portable, no cert discovery.
      # (The msi target was removed from package.json in v6.2.0 — no release
      # ever shipped one. Don't reintroduce it here or in build.bat.)
      # --publish never is REQUIRED here. In CI, electron-builder auto-detects
      # the environment and tries to publish to GitHub itself; with no token it
      # exits 1 *after* building successfully, killing the job before the upload
      # step runs. Setting GH_TOKEN empty does not prevent this - only the flag
      # does. The upload step below owns publishing.
      # The azureSignOptions are passed on the command line so package.json
      # carries no signing config and a home build.bat run is unaffected.
      # Endpoint is the East US Artifact Signing endpoint (account region).
      - name: Build and sign Windows targets (nsis + portable)
        shell: pwsh
        run: npx electron-builder --win nsis portable --publish never --config.win.azureSignOptions.publisherName="Johan Broman" --config.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net --config.win.azureSignOptions.codeSigningAccountName=broman-net-suite --config.win.azureSignOptions.certificateProfileName=net-suite
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Verify signatures
        shell: pwsh
        run: |
          Get-ChildItem dist\NET-ETHER-*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0,-45} {1,-12} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "Unsigned or invalid signature: $($_.Name)" }
          }

      - name: Show what got built
        run: dir dist
        shell: cmd

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          # Only the shippable files - skips win-unpacked/, builder-debug.yml, etc.
          files: |
            dist/NET-ETHER-Installer-*.exe
            dist/NET-ETHER-portable-*.exe
          # dist/NET-ETHER-Setup-*.msi
          fail_on_unmatched_files: true
