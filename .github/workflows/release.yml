name: Build and attach release binaries

# Two ways to run:
#   1. Push a tag like v6.1.1  -> builds and attaches automatically
#   2. Actions tab -> Run workflow -> type a tag  -> backfills that release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build. The leading v is optional - 6.1.0 and v6.1.0 both work.'
        required: true

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Normalizes "6.1.0" -> "v6.1.0", strips stray whitespace, and confirms
      # the tag actually exists before spending 10 minutes building.
      # Fails in ~2 seconds with a list of real tags if you fat-finger it.
      - name: Resolve and verify tag
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RAW_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            CLEAN="$(printf '%s' "$RAW_TAG" | tr -d '[:space:]')"
            if [ -z "$CLEAN" ]; then
              echo "::error::No tag was given."
              exit 1
            fi
            case "$CLEAN" in
              v*) TAG="$CLEAN" ;;
              *)  TAG="v$CLEAN" ;;
            esac
          else
            # Tag push: github.ref_name is already the bare tag, e.g. v6.1.1
            TAG="$REF_NAME"
          fi

          if ! git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in this repository."
            echo "Tags that do exist:"
            git ls-remote --tags "$REPO_URL" \
              | sed 's|.*refs/tags/||' \
              | grep -v '\^{}' \
              | sort
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mirrors build.bat exactly: nsis + portable, no msi, no cert discovery.
      # The msi target is declared in package.json but was deliberately dropped
      # from build.bat, so don't reintroduce it here.
      - name: Build Windows targets (nsis + portable)
        run: npx electron-builder --win nsis portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder tries to auto-publish when it sees a token.
          # Leave this off so the upload step below owns that job.
          GH_TOKEN: ''

      - name: Show what got built
        run: dir dist
        shell: cmd

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          # Only the shippable files - skips win-unpacked/, builder-debug.yml, etc.
          files: |
            dist/NET-ETHER-Installer-*.exe
            dist/NET-ETHER-portable-*.exe
          # dist/NET-ETHER-Setup-*.msi
          fail_on_unmatched_files: true
