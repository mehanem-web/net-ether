name: Build and attach release binaries

# Fires when you push a tag like v6.1.1
# Also runnable by hand from the Actions tab against an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v6.1.0)'
        required: true

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all Windows targets
        run: npm run build-all
        env:
          # electron-builder tries to auto-publish when it sees a token.
          # Leave this off so the upload step below owns that job.
          GH_TOKEN: ''

      - name: Show what got built
        run: dir dist
        shell: cmd

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Only the shippable files - skips win-unpacked/, builder-debug.yml, etc.
          files: |
            dist/NET-ETHER-Installer-*.exe
            dist/NET-ETHER-Setup-*.msi
            dist/NET-ETHER-portable-*.exe
          fail_on_unmatched_files: true
